name: Release
run-name: Release on push to ${{ github.ref_name }}

on:
  push:
    # `main` cuts a release. `beta` cuts a prerelease of whatever is pushed
    # there: a snapshot version (`X.Y.Z-beta.<timestamp>`) published under
    # the `beta` dist-tag. Nothing is committed, tagged or merged for it, so
    # the branch can be thrown away afterwards.
    branches: [main, beta]

# Cancel-in-progress is off: a release run that's already publishing must not
# be killed by the next push, or we'd leave half-applied tags/versions behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # commit version bump, push tag, create GitHub release
  packages: write   # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.gate.outputs.should-release }}
      bump: ${{ steps.gate.outputs.bump }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `changeset status` can compare against `main`'s
          # base branch and produce a stable release set.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick release channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            # `changeset status` measures against a local `main`, which a
            # checkout of another branch doesn't have.
            git branch --force main origin/main
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        # v6 rather than v7 on purpose: v7 no longer exports a placeholder
        # NODE_AUTH_TOKEN, so pnpm warns on every command that the token
        # referenced by the generated .npmrc is unset.
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aih-software'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start DynamoDB Local
        run: docker compose up -d dynamodb-local

      - name: Run integration tests
        run: pnpm test

      - name: Stop DynamoDB Local
        if: always()
        run: docker compose down

      - name: Compute pending bump
        id: gate
        run: |
          # `changeset status` writes a JSON manifest of pending releases.
          # Tolerate the no-changeset case — emit an empty file so the gate
          # script handles it identically to ENOENT.
          pnpm changeset status --output=/tmp/changeset-status.json || echo '{}' > /tmp/changeset-status.json
          node scripts/should-release.mjs /tmp/changeset-status.json

      - name: Apply version bumps
        if: steps.gate.outputs.should-release == 'true'
        run: |
          if [ "${{ steps.channel.outputs.prerelease }}" = "true" ]; then
            # Same version the release would get, plus `-beta.<timestamp>`
            # (see `snapshot` in .changeset/config.json).
            pnpm changeset version --snapshot beta
          else
            pnpm changeset version
          fi

      - name: Build
        if: steps.gate.outputs.should-release == 'true'
        run: pnpm build

      - name: Capture version
        id: version
        if: steps.gate.outputs.should-release == 'true'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, push
        # A prerelease leaves no trace in git: its version exists only in the
        # published package.
        if: steps.gate.outputs.should-release == 'true' && steps.channel.outputs.prerelease != 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          # `[skip ci]` keeps this push from re-triggering the workflow.
          git commit -m "chore(release): v${version} [skip ci]"
          git tag "v${version}"
          git push origin HEAD:main
          git push origin "v${version}"

      - name: Publish to GitHub Packages
        if: steps.gate.outputs.should-release == 'true'
        # A prerelease must not become `latest`; npm also refuses to publish
        # a prerelease version without an explicit tag.
        run: pnpm publish --no-git-checks ${{ steps.channel.outputs.prerelease == 'true' && '--tag beta' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.gate.outputs.should-release == 'true' && steps.channel.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${{ steps.version.outputs.version }}
          # Extract the freshly-prepended section from CHANGELOG.md (between
          # the first `## ` heading and the second). Falls back to a generic
          # message if the file is missing or malformed.
          notes=$(awk '/^## /{ if (++n==2) exit } n==1' CHANGELOG.md || true)
          if [ -z "$notes" ]; then notes="Release v${version}"; fi
          gh release create "v${version}" \
            --title "v${version}" \
            --notes "$notes"

      - name: Skip summary
        if: steps.gate.outputs.should-release != 'true'
        run: |
          echo "No release this run — no pending changesets."

  # Minor and major releases also publish to the public npmjs registry.
  # Patch releases stay GitHub-Packages-only — external consumers shouldn't
  # be churned by every internal patch, only by intentional feature/breaking
  # changes.
  publish-public:
    needs: release
    if: needs.release.outputs.bump == 'minor' || needs.release.outputs.bump == 'major'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the job proves who it is with a short-lived
      # OIDC token instead of a stored npm token.
      id-token: write
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@v7
        with:
          # A prerelease has no tag; it is built from the pushed commit.
          ref: ${{ needs.release.outputs.prerelease == 'true' && github.sha || format('v{0}', needs.release.outputs.version) }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          scope: '@open-aih'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Retarget package for public @open-aih publish
        # The repo source-of-truth is the private @aih-software scope on
        # GitHub Packages. For the public mirror on npmjs we rewrite name
        # and publishConfig in-place — the change is never committed.
        # The version is set here too: a prerelease's version was never
        # committed, so the checkout doesn't carry it.
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@open-aih/payload-ddb';
            pkg.version = process.env.VERSION;
            pkg.publishConfig = { registry: 'https://registry.npmjs.org', access: 'public' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to npmjs
        # No token: npm authenticates through trusted publishing (OIDC). That
        # needs npm >= 11.5.1, which is why this calls the npm CLI directly
        # (pnpm 10 has no OIDC support of its own) on Node 24. The trusted
        # publisher configured on npmjs.com for @open-aih/payload-ddb must
        # name this repository and this workflow file (`release.yml`), with
        # no environment. The repo is public, so npm also attaches a
        # provenance attestation, which requires `repository.url` in
        # package.json to keep pointing at this repository.
        run: |
          echo "node $(node --version), npm $(npm --version)"
          npm publish --access public ${{ needs.release.outputs.prerelease == 'true' && '--tag beta' || '' }}
